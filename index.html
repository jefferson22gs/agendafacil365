<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

    <!-- Aplica o modo salvo antes do primeiro paint (evita flash). Claro é o padrão. Chave legada lida como fallback. -->
    <script>
      try {
        var m = localStorage.getItem('agenda-facil-365-mode') || localStorage.getItem('syshair-mode');
        if (m === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>

    <!-- Primary Meta Tags -->
    <title>Agenda Fácil 365 | Agendamento online e gestão para negócios de serviços</title>
    <meta name="title" content="Agenda Fácil 365 | Agendamento online e gestão para negócios de serviços" />
    <meta name="description" content="Agendamento online e gestão para negócios de serviços: agenda, clientes, equipe, financeiro e lembretes em um só lugar." />
    <meta name="keywords" content="agendamento online, agenda de serviços, gestão de clientes, salão de beleza, barbearia, estética" />

    <!-- Open Graph / Twitter (URL absoluta só será definida quando o domínio público for confirmado) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agenda Fácil 365" />
    <meta property="og:title" content="Agenda Fácil 365" />
    <meta property="og:description" content="Agendamento online e gestão para negócios de serviços." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agenda Fácil 365" />
    <meta name="twitter:description" content="Agendamento online e gestão para negócios de serviços." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agenda Fácil" />
    <meta name="application-name" content="Agenda Fácil 365" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#2563EB" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
