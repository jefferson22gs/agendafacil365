# Agenda Fácil 365 — Supabase (config LOCAL da CLI; não altera o projeto remoto sem `supabase config push`)
project_id = "ocbwsaydgkiseeardjga"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:8080"
# Domínio novo incluído sem remover o antigo (transição). Aplicar no painel Auth do projeto remoto na fase B.
additional_redirect_urls = ["http://localhost:8080/*", "https://syshair.vercel.app/*", "https://agendafacil365.com.br/*", "https://www.agendafacil365.com.br/*"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true

[auth.sms]
enable_signup = false

[functions.generate-image-caption]
verify_jwt = false

# JWT do usuário é validado internamente via Auth getUser; vínculo do salão no servidor.
[functions.whatsapp-instances]
verify_jwt = false

# Autenticação validada dentro das funções: usuário do salão ou chave secreta do worker.
[functions.whatsapp-reply]
verify_jwt = false

[functions.send-push-fcm]
verify_jwt = false

[functions.send-push]
verify_jwt = false

[functions.send-push-notification]
verify_jwt = false

# Exige super admin dentro da função (JWT + is_super_admin()).
[functions.ai-admin]
verify_jwt = false

# Webhook valida segredo privado por instância; não recebe JWT Supabase do provedor.
[functions.evolution-webhook]
verify_jwt = false

[functions.whatsapp-dispatch]
verify_jwt = true

[functions.broadcast-messages]
verify_jwt = false

# Webhook externo (Mercado Pago não envia JWT do Supabase)
[functions.mercadopago-webhook]
verify_jwt = false

# Worker valida authorizeWorker (cron/Vault); disparo manual valida authorizeSalon + tenant do alerta.
[functions.process-return-alerts]
verify_jwt = false

# Valida o JWT do dono dentro da função (getUser).
[functions.autentique-contract]
verify_jwt = false

# Webhook externo: autenticado por HMAC (X-Autentique-Signature), não por JWT.
[functions.autentique-webhook]
verify_jwt = false

[functions.meta-webhook]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

[functions.package-checkout]
verify_jwt = false

[functions.meta-embedded-signup]
verify_jwt = false

[functions.client-emails]
verify_jwt = false

[functions.whaileys-webhook]
verify_jwt = false
